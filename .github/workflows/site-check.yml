name: Build, validate, and back up the Next.js site

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build and validate exported pages
        run: npm run check

  weekly-backup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create restorable archive
        run: tar --exclude='.git' --exclude='.impeccable' --exclude='node_modules' --exclude='.next' --exclude='out' -czf "codeylon-site-${GITHUB_RUN_ID}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: codeylon-site-backup-${{ github.run_id }}
          path: codeylon-site-${{ github.run_id }}.tar.gz
          retention-days: 90
